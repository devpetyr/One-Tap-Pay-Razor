<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micropayment Test | Select Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full text-center border border-gray-100">
        <div class="mb-4">
            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Test Mode</span>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Unlock Access</h1>
        <p class="text-gray-500 mb-8 text-sm">Select your preferred 1-tap payment method.</p>
        
        <div class="space-y-4">
            <!-- APPLE PAY BUTTON -->
            <button onclick="openRazorpay('apple')" 
               class="flex items-center justify-center w-full text-white bg-black hover:bg-gray-900 font-medium rounded-xl text-lg px-5 py-3.5 transition-all shadow-sm active:scale-95">
                <!-- SVG Icon removed for brevity, keep yours here -->
                🍎 <span class="ml-2">Apple Pay</span>
            </button>

            <!-- GOOGLE PAY BUTTON -->
            <button onclick="openRazorpay('google')" 
               class="flex items-center justify-center w-full text-gray-900 bg-white border border-gray-300 hover:bg-gray-50 font-medium rounded-xl text-lg px-5 py-3.5 transition-all shadow-sm active:scale-95">
                <!-- SVG Icon removed for brevity, keep yours here -->
                <svg class="h-5 w-auto mr-2" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5,10V17H6.5V10H17.5z M20,7.5A2.5,2.5,0,0,1,22.5,10v4a2.5,2.5,0,0,1-2.5,2.5h-5V20h5a5,5,0,0,0,5-5v-4a5,5,0,0,0-5-5h-5v2.5H20Z"/></svg>
                Google Pay
            </button>

            <!-- UPI BUTTON -->
            <button onclick="openRazorpay('upi')" 
               class="flex items-center justify-center w-full text-white bg-green-600 hover:bg-green-700 font-medium rounded-xl text-lg px-5 py-3.5 transition-all shadow-sm active:scale-95">
                <!-- SVG Icon removed for brevity, keep yours here -->
                ⚡ <span class="ml-2">UPI</span>
            </button>
        </div>
    </div>

    <script>
     function openRazorpay(methodType) {
        var options = {
            "key": "rzp_test_us_Sm7G1jPqW3R8MJ", // Your Test Key
            "amount": "100", // Amount in paisa (1 INR = 100)
            "currency": "INR",
            "name": "Micropayment Test",
            "description": "Payment for Service",
            
            // --- THE FIX IS HERE ---
            // We explicitly disable 'card' and 'netbanking'. 
            // By doing this, Razorpay defaults to UPI, which includes GPay, Paytm, etc.
            "method": {
                "card": false,
                "wallet": false,
                "netbanking": false
            },
            // -----------------------
            
            "handler": function (response) {
                console.log("Success:", response);
                window.location.href = "unlock.html";
            },
            "modal": {
                "ondismiss": function() {
                    window.location.href = "failure.html";
                }
            }
        };

        try {
            var rzp1 = new Razorpay(options);
            
            rzp1.on('payment.failed', function (response){
                alert("Payment Failed: " + response.error.description);
                window.location.href = "failure.html";
            });

            rzp1.open();
        } catch (error) {
            console.error(error);
            alert("Razorpay Script Error");
        }
    }
    </script>
</body>
</html>
