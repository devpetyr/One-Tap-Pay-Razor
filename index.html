    <!-- Load Razorpay Checkout -->

        <div class="mb-4">
            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Test Mode</span>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Unlock Access</h1>
        <p class="text-gray-500 mb-8 text-sm">Select your preferred 1-tap payment method below to continue.</p>
        
        <div class="space-y-4">
            <!-- APPLE PAY BUTTON -->
            <button onclick="openRazorpay()" 
               class="flex items-center justify-center w-full text-white bg-black hover:bg-gray-900 font-medium rounded-xl text-lg px-5 py-3.5 transition-all shadow-sm active:scale-95">
                <svg class="h-5 w-auto mr-2" fill="currentColor" viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
                Apple Pay
            </button>

            <!-- GOOGLE PAY BUTTON -->
            <button onclick="openRazorpay()" 
               class="flex items-center justify-center w-full text-gray-900 bg-white border border-gray-300 hover:bg-gray-50 font-medium rounded-xl text-lg px-5 py-3.5 transition-all shadow-sm active:scale-95">
                <svg class="h-5 w-auto mr-2" viewBox="0 0 48 48" fill="none"><path d="M43.611 20.083H42V20H24V28H35.303C33.645 32.748 29.213 36 24 36C17.373 36 12 30.627 12 24C12 17.373 17.373 12 24 12C27.059 12 29.843 13.152 31.961 15.039L37.618 9.382C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24C4 35.045 12.955 44 24 44C35.045 44 44 35.045 44 24C44 22.659 43.862 21.35 43.611 20.083Z" fill="#FFC107"/><path d="M44 24C44 22.659 43.862 21.35 43.611 20.083H42V20H24V28H35.303C34.502 30.347 33.004 32.298 31.066 33.649L31.065 33.65L37.243 38.43C41.229 34.73 44 29.564 44 24Z" fill="#1976D2"/><path d="M24 44C29.268 44 34.046 41.947 37.243 38.43L31.065 33.65C29.123 34.981 26.685 35.819 24 35.819C18.665 35.819 14.156 32.404 12.511 27.671L6.23303 32.53C9.69703 39.381 16.35 44 24 44Z" fill="#4CAF50"/><path d="M12.511 27.671C12.181 26.505 12 25.276 12 24C12 22.724 12.181 21.495 12.511 20.329L6.23303 15.47C4.81103 18.067 4 20.949 4 24C4 27.051 4.81103 29.933 6.23303 32.53L12.511 27.671Z" fill="#F44336"/></svg>
                Google Pay
            </button>

            <!-- UPI BUTTON -->
            <button onclick="openRazorpay()" 
               class="flex items-center justify-center w-full text-white bg-green-600 hover:bg-green-700 font-medium rounded-xl text-lg px-5 py-3.5 transition-all shadow-sm active:scale-95">
                <svg class="h-5 w-auto mr-2" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                Pay with UPI
            </button>
        </div>
    </div>

    <script>
     function openRazorpay() {
        var options = {
            "key": "rzp_test_us_Sm7G1jPqW3R8MJ", 
            "amount": "100", 
            "currency": "INR",
            "name": "Micropayment Test",
            "handler": function (response) {
                // Success redirect
                window.location.href = "unlock.html";
            },
            "modal": {
                "ondismiss": function() {
                    // Cancel redirect
                    window.location.href = "failure.html";
                }
            }
        };

        try {
            var rzp1 = new Razorpay(options);
            
            rzp1.on('payment.failed', function (response){
                // Failure redirect
                window.location.href = "failure.html";
            });

            rzp1.open();
        } catch (error) {
            alert("Razorpay Failed to Load. Check your API Key and ensure you are using a web server/CDN.");
        }
    }
    </script>
</body>
</html>
