<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micropayment Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full text-center border border-gray-100">
        <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Unlock Access</h1>
        <p class="text-gray-500 mb-8 text-sm">Secure payment to continue.</p>
        
        <!-- ONLY ONE BUTTON REQUIRED -->
        <button onclick="payNow()" 
           class="flex items-center justify-center w-full text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-xl text-lg px-5 py-3.5 transition-all shadow-md active:scale-95">
           Pay Now
        </button>
    </div>

   <script>
function payNow() {
  const options = {
    "key": "rzp_test_us_Sm7G1jPqW3R8MJ", 
    "amount": "100",          // Use string "100" to be safe with decimals
    "currency": "INR",
    "name": "Micropayment Test",
    
    "handler": function (response){
      window.location.href = "success.html";
    },
    "modal": {
      "ondismiss": function(){
        window.location.href = "failed.html";
      }
    },

    // ✅ PREFILL SECTION ADDED HERE
    "prefill": {
      "name": "John Doe",     // Customer Name
      "email": "user@example.com", // Customer Email
      "contact": "9999999999" // Customer Phone Number (Contact)
    },

    /* 
       By NOT adding 'method' restrictions here, 
       Razorpay defaults to showing ALL enabled payment methods
       (UPI, GPay, Apple Pay, Card, Wallet).
    */
  };

  try {
    var rzp1 = new Razorpay(options);
    
    rzp1.on("payment.failed", function(response){
      alert("Payment Failed");
      console.error(response.error);
      window.location.href = "failed.html";
    });

    rzp1.open();
  } catch (error) {
    console.error(error);
    alert("Checkout Error");
  }
}

</script>
</body>
</html>
