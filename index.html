<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micropayment Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full text-center border border-gray-100">
        <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Select Payment</h1>
        <p class="text-gray-500 mb-8 text-sm">Choose Google Pay, UPI, or Apple Pay.</p>
        
        <div class="space-y-4">
            <!-- GOOGLE PAY / UPI -->
            <button onclick="openRazorpay()" 
               class="flex items-center justify-center w-full text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-xl text-lg px-5 py-3.5 transition-all shadow-sm active:scale-95">
                📱 Pay with UPI / GPay
            </button>

            <!-- APPLE PAY -->
            <button onclick="openRazorpay()" 
               class="flex items-center justify-center w-full text-white bg-black hover:bg-gray-900 font-medium rounded-xl text-lg px-5 py-3.5 transition-all shadow-sm active:scale-95">
                🍎 Apple Pay
            </button>
        </div>
    </div>

    <script>
     function openRazorpay() {
        const options = {
            "key": "rzp_test_us_Sm7G1jPqW3R8MJ", 
            "amount": "100", 
            "currency": "INR",
            "name": "Micropayment Test",
            "description": "Payment for Service",

            handler: function (response){
                window.location.href = "success.html";
            },
            modal: {
                "ondismiss": function(){
                    window.location.href = "failed.html";
                }
            },

            // THIS IS THE KEY FIX TO REMOVE CARDS
            "method": {
                "card": false,      // Hides Credit/Debit Card input
                "netbanking": false,// Hides Internet Banking
                "wallet": false     // Hides existing Wallets (optional)
            },

            config: {
                display: {
                    blocks: {
                        upi: {
                            name: "Pay via UPI",
                            instruments: [
                                { method: "upi" },
                                { method: "qr" } // Shows QR codes too
                            ],
                            heading: "UPI Payment"
                        }
                        // NOTE: "card" block removed here to prevent UI generation
                    },
                    // Force UPI Block to show first
                    sequence: ["block.upi"], 
                    preferences: {
                        show_default_blocks: false
                    }
                }
            }
        };

        try {
            var rzp1 = new Razorpay(options);
            
            rzp1.on("payment.failed", function(response){
                alert("Payment Failed");
                console.error(response.error.description);
                window.location.href = "failed.html";
            });

            rzp1.open();
        } catch (error) {
            console.error("Checkout Error:", error);
            alert("Could not load checkout. Check Console.");
        }
    }
    </script>
</body>
</html>
